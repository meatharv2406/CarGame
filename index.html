<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Car Racing Game</title>
            <style>
        :root {
            --control-size: clamp(55px, 9vmin, 80px);
            --control-gap: clamp(10px, 2.5vw, 25px);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        html {
            min-height: 100%;
            overflow-x: hidden;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        body {
            background: #1a1a1a;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            min-height: 100dvh;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            gap: 10px;
            padding: 10px;
            overflow-x: hidden;
            overflow-y: auto;
            touch-action: pan-y;
        }

        #game-container {
            position: relative;
            flex: 0 0 auto;
            width: min(100%, 1200px);
            aspect-ratio: 16 / 9;
            height: auto;
            max-height: 72dvh;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-radius: 10px;
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #222;
        }

        #hud {
            position: absolute;
            top: 8px;
            left: 8px;
            background: rgba(0, 0, 0, 0.75);
            padding: 7px 10px;
            border-radius: 8px;
            border-left: 4px solid #ff3333;
            font-family: monospace;
            font-size: clamp(10px, 1.8vmin, 13px);
            line-height: 1.4;
            pointer-events: none;
            z-index: 10;
        }

        #race-standings {
            position: absolute;
            top: 10px;
            right: 10px;
            min-width: 128px;
            padding: 8px 10px;
            border: 1px solid rgba(255,255,255,0.28);
            border-radius: 8px;
            background: rgba(8, 15, 20, 0.76);
            color: #fff;
            font: 11px/1.65 monospace;
            pointer-events: none;
            z-index: 10;
        }

        #race-standings .standing-player {
            color: #ff7770;
            font-weight: bold;
        }

        #pc-controls {
            display: none;
            position: absolute;
            left: 50%;
            bottom: 14px;
            transform: translateX(-50%);
            padding: 9px 14px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 999px;
            background: rgba(8, 15, 20, 0.78);
            color: #fff;
            font: 12px monospace;
            white-space: nowrap;
            pointer-events: none;
            z-index: 10;
        }

        html.pc-mode #touch-controls {
            display: none;
        }

        html.pc-mode #pc-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        html.pc-mode #game-container {
            width: min(100%, 1400px);
            max-height: 80dvh;
        }

        #pc-controls kbd {
            padding: 3px 6px;
            border: 1px solid #687980;
            border-radius: 5px;
            background: #26363d;
            color: #a7f2df;
            font: inherit;
        }

        #coin-wallet {
            position: absolute;
            left: 10px;
            bottom: 10px;
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 8px 12px;
            border: 1px solid rgba(255, 215, 91, 0.5);
            border-radius: 999px;
            background: rgba(8, 15, 20, 0.82);
            color: #ffd75b;
            font: bold 13px monospace;
            pointer-events: none;
            z-index: 10;
        }

        #coin-wallet .coin-icon {
            font-size: 18px;
        }

        #race-result[hidden] {
            display: none;
        }

        #race-result {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            padding: 16px;
            background: rgba(5, 12, 17, 0.62);
            z-index: 20;
        }

        .result-card {
            width: min(100%, 360px);
            padding: 24px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 18px;
            background: linear-gradient(145deg, #263840, #10191e);
            box-shadow: 0 16px 45px rgba(0, 0, 0, 0.45);
            text-align: center;
        }

        .result-eyebrow {
            color: #8fe6d2;
            font: bold 12px monospace;
            letter-spacing: 0.16em;
        }

        #result-position {
            margin: 9px 0 18px;
            font-size: clamp(26px, 5vw, 38px);
        }

        .result-reward {
            display: grid;
            grid-template-columns: auto 1fr;
            align-items: center;
            gap: 3px 12px;
            width: fit-content;
            margin: 0 auto 12px;
            padding: 12px 18px;
            border: 1px solid rgba(255, 215, 91, 0.45);
            border-radius: 14px;
            background: rgba(255, 215, 91, 0.1);
            color: #ffd75b;
        }

        .result-reward .coin-icon {
            grid-row: span 2;
            font-size: 30px;
        }

        #result-earned {
            font-size: 25px;
        }

        .result-reward-label {
            font: bold 10px monospace;
            letter-spacing: 0.1em;
        }

        #result-bank {
            margin-bottom: 18px;
            color: #d3e2e8;
            font: 13px monospace;
        }

        #restart-race {
            width: 100%;
            min-height: 48px;
            border: 0;
            border-radius: 12px;
            background: #00c89c;
            color: #07251e;
            font: bold 15px 'Segoe UI', sans-serif;
            touch-action: manipulation;
        }

        .stat-val {
            color: #00ffcc;
            font-weight: bold;
        }

        #touch-controls {
            display: grid;
            grid-template-columns: auto 1fr auto;
            justify-content: space-between;
            align-items: center;
            width: min(100%, 1200px);
            gap: 12px;
            margin: 0 auto;
            flex-shrink: 0;
            touch-action: none;
        }

        .control-group {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: clamp(6px, 1.5vw, 18px);
            min-width: 0;
            flex-shrink: 1;
        }

        .btn {
            display: flex;
            justify-content: center;
            align-items: center;
            flex: 0 0 auto;
            width: var(--control-size);
            height: var(--control-size);
            border: 2px solid #444;
            border-radius: 50%;
            background: #2a2a2a;
            color: white;
            font-weight: bold;
            font-size: clamp(16px, 2.7vmin, 22px);
            touch-action: none;
            -webkit-tap-highlight-color: transparent;
        }

        .mobile-label {
            display: none;
        }

        .btn.active-touch {
            background: #ff3333;
            border-color: #ff6666;
        }

        .btn-rect {
            width: clamp(66px, 10.5vw, 115px);
            height: clamp(46px, 8vmin, 60px);
            border-radius: 10px;
            font-size: clamp(11px, 1.8vmin, 15px);
        }

        .btn-nitro {
            width: clamp(77.5px, 12.5vw, 135px);
            height: clamp(50px, 8.5vmin, 70px);
            border-radius: 12px;
            background: #9b59b6;
            border-color: #8e44ad;
            font-size: clamp(11px, 1.8vmin, 15px);
        }

        .btn-nitro.active-touch {
            background: #e74c3c;
        }
        /* Landscape phones and compact tablets: keep controls in one row. */
       @media (orientation: landscape) and (max-height: 520px) {
    body {
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        align-items: center;
        gap: 10px;
        padding: 6px 0;
        overflow-y: auto;
        overflow-x: hidden;
        touch-action: pan-y;
    }

    #game-container {
        width: min(100%, calc((100dvh - 130px) * 16 / 9));
        max-height: calc(100dvh - 120px);
        flex-shrink: 0;
    }

    #touch-controls {
        grid-template-columns: auto 1fr auto;
        width: 100%;
        gap: 8px;
        padding: 0 8px;
    }

    .control-group {
        gap: 8px;
    }

    :root {
        --control-size: 76px;
    }

    .btn-rect {
        width: 100px;
        height: 56px;
        font-size: 13px;
    }

    .btn-nitro {
        width: 120px;
        height: 64px;
        font-size: 14px;
    }

    #touch-controls {
        max-width: 1000px;
    }
}
            /* Stack pedals and steering above the gear controls on narrow phones. */
        @media (max-width: 560px) and (orientation: portrait) {
            #game-container {
                width: 100%;
                aspect-ratio: 4 / 3;
                max-height: 48dvh;
            }

            #touch-controls {
                    grid-template-columns: 1fr 1fr;
                    gap: 10px 6px;
            }

            #touch-controls .control-group:nth-child(2) {
                grid-column: 1 / -1;
                grid-row: 2;
                    gap: 8px;
            }

            #touch-controls .control-group:nth-child(3) {
                grid-column: 2;
                grid-row: 1;
            }

            #touch-controls .control-group:nth-child(1) {
                grid-column: 1;
                grid-row: 1;
            }

            .control-group {
                gap: 12px;
            }

            :root {
                --control-size: clamp(60px, 17vw, 72px);
            }

            .btn-rect {
                width: clamp(62px, 19vw, 76px);
                height: 52px;
            }

            .btn-nitro {
                width: clamp(74px, 22vw, 88px);
                height: 56px;
            }

            .desktop-key {
                display: none;
            }

            .mobile-label {
                display: inline;
                font-size: 10px;
                letter-spacing: 0.02em;
            }

            #race-standings {
                min-width: 100px;
                top: 8px;
                right: 8px;
                padding: 6px 8px;
                font-size: 10px;
            }

            #coin-wallet {
                left: 8px;
                bottom: 8px;
                padding: 6px 9px;
                font-size: 11px;
            }
        }
    </style>


</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div id="hud">
            <div>GEAR: <span id="hud-gear" class="stat-val">1</span> / 7</div>
            <div>SPEED: <span id="hud-speed" class="stat-val">0.00</span></div>
            <div>POS: <span id="hud-max" class="stat-val">1</span></div>
            <div>LAP: <span id="hud-lap" class="stat-val">1 / 3</span></div>
            <div>AI RACE: <span class="stat-val">4 BOTS</span></div>
        </div>
        <div id="race-standings" aria-label="Race standings"></div>
        <div id="coin-wallet" aria-label="Coin bank">
            <span class="coin-icon" aria-hidden="true">🪙</span>
            <span>COIN BANK: <span id="coin-total">0</span></span>
        </div>
        <div id="pc-controls" aria-label="Keyboard controls">
            <kbd>WASD</kbd> DRIVE / STEER
            <kbd>SPACE</kbd> NITRO
            <kbd>↑ / ↓</kbd> GEARS
        </div>
        <div id="race-result" role="dialog" aria-modal="true" aria-labelledby="result-position" hidden>
            <div class="result-card">
                <div class="result-eyebrow">RACE COMPLETE</div>
                <h2 id="result-position">5TH PLACE</h2>
                <div class="result-reward">
                    <span class="coin-icon" aria-hidden="true">🪙</span>
                    <strong id="result-earned">0</strong>
                    <span class="result-reward-label">COINS EARNED</span>
                </div>
                <div id="result-bank">COIN BANK: 0</div>
                <button id="restart-race" type="button">RACE AGAIN</button>
            </div>
        </div>
    </div>

    <div id="touch-controls">
        <!-- Steering Group -->
        <div class="control-group">
            <button class="btn" id="btn-left" data-control="left">◀</button>
            <button class="btn" id="btn-right" data-control="right">▶</button>
        </div>
        
        <!-- Gears & Nitro -->
        <div class="control-group">
            <button class="btn btn-rect" id="btn-down" data-action="gear-down">GEAR -</button>
            <button class="btn btn-rect btn-nitro" id="btn-nitro" data-control="nitro">NITRO</button>
            <button class="btn btn-rect" id="btn-up" data-action="gear-up">GEAR +</button>
        </div>
        
        <!-- Pedals Group -->
        <div class="control-group">
            <button class="btn" id="btn-reverse" data-control="reverse" aria-label="Brake">
                <span class="desktop-key">S</span><span class="mobile-label">BRAKE</span>
            </button>
            <button class="btn" id="btn-drive" data-control="forward" aria-label="Accelerate">
                <span class="desktop-key">W</span><span class="mobile-label">DRIVE</span>
            </button>
        </div>
    </div>

    <script type="text/plain">
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const hudGear = document.getElementById('hud-gear');
        const hudSpeed = document.getElementById('hud-speed');
        const hudMax = document.getElementById('hud-max');

        const maxgear = 7;
        const mingear = 0;
        let trackLength = 0;

        const controls = {
            forward: false,
            reverse: false,
            left: false,
            right: false,
            nitro: false
        };

        const game = {
            gear: 1,
            speed: 0,
            lane: 0,
            maxSpeed: 170,
            distance: 0,
            friction: 0.985,
            boost: 0,
            lap: 1,
            totalLaps: 3,
            finished: false,
            blunder: 0,
            shake: 0
        };

        const aiBots = [
            { name: 'BOT 1', color: '#ffd166', lane: -0.75, speed: 125, distance: 180 },
            { name: 'BOT 2', color: '#06d6a0', lane: 0.2, speed: 138, distance: 260 },
            { name: 'BOT 3', color: '#00b4d8', lane: -0.15, speed: 118, distance: 420 },
            { name: 'BOT 4', color: '#9b5de5', lane: 0.7, speed: 146, distance: 310 }
        ];

        function clamp(value, min, max) {
            return Math.min(Math.max(value, min), max);
        }

        function lerp(a, b, t) {
            return a + (b - a) * t;
        }

        function shiftGear(direction) {
            if (game.finished) return;
            game.gear += direction;
            game.gear = clamp(game.gear, mingear, maxgear);
        }

        function updateGearLimits() {
            switch (game.gear) {
                case 0: game.maxSpeed = 0; break;
                case 1: game.maxSpeed = 38; break;
                case 2: game.maxSpeed = 62; break;
                case 3: game.maxSpeed = 88; break;
                case 4: game.maxSpeed = 118; break;
                case 5: game.maxSpeed = 142; break;
                case 6: game.maxSpeed = 165; break;
                case 7: game.maxSpeed = 210; break;
            }
        }

        function roadCurve(z) {
            return Math.sin((game.distance + z) * 0.022) * 210 + Math.sin((game.distance + z) * 0.009) * 95;
        }

        function triggerBlunder(reason) {
            game.blunder = 55;
            game.shake = 18;
            game.speed *= 0.25;
            if (reason === 'wall') {
                game.lane *= -0.3;
            }
        }

        function detectCollisions() {
            const playerLane = game.lane;
            const playerDist = game.distance;

            if (Math.abs(playerLane) > 1.42 && Math.abs(game.speed) > 24) {
                triggerBlunder('wall');
            }

            aiBots.forEach((bot) => {
                const diff = Math.abs(bot.distance - playerDist);
                const laneDiff = Math.abs(bot.lane - playerLane);
                if (diff < 18 && laneDiff < 0.3) {
                    triggerBlunder('crash');
                }
            });
        }

        function updatePlayer() {
            if (game.finished) return;

            if (game.blunder > 0) {
                game.blunder -= 1;
                game.shake = Math.max(0, game.shake - 1.2);
            }

            updateGearLimits();

            if (controls.forward) game.speed += 1.8 + game.gear * 1.2;
            if (controls.reverse) game.speed -= 2.8;

            if (Math.abs(game.speed) > 2) {
                if (controls.left) game.lane -= 0.08 + (game.speed / 150);
                if (controls.right) game.lane += 0.08 + (game.speed / 150);
            }

            if (controls.nitro) {
                game.boost = 12;
                game.speed += 1.3;
            }

            if (game.boost > 0) {
                game.boost -= 1;
                game.speed += 0.65;
            }

            game.lane = clamp(game.lane, -1.6, 1.6);
            game.speed *= game.friction;
            game.speed = clamp(game.speed, -20, game.maxSpeed + (game.boost > 0 ? 22 : 0));

            if (controls.forward || controls.reverse) {
                game.distance += game.speed * 0.9;
            }

            detectCollisions();

            if (game.distance > trackLength) {
                game.distance = 0;
                game.lap += 1;
                if (game.lap > game.totalLaps) {
                    game.finished = true;
                }
            }
        }

        function updateAIBots() {
            aiBots.forEach((bot, idx) => {
                bot.distance += (bot.speed + (idx % 2) * 8) * 0.9;
                if (bot.distance > trackLength) bot.distance = 0;

                bot.lane += Math.sin((bot.distance + idx * 50) * 0.01) * 0.012;
                bot.lane = clamp(bot.lane, -1.25, 1.25);
            });
        }

        function drawBackground() {
            const sky = ctx.createLinearGradient(0, 0, 0, canvas.height);
            sky.addColorStop(0, '#7cc7ff');
            sky.addColorStop(0.55, '#bfe9ff');
            sky.addColorStop(0.56, '#bde98d');
            sky.addColorStop(1, '#7fcf66');
            ctx.fillStyle = sky;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < 14; i++) {
                const x = ((i * 105 + (game.distance * 0.6) % 110) % (canvas.width + 160)) - 80;
                const y = 36 + (i % 5) * 18;
                ctx.fillStyle = '#9ed76d';
                ctx.beginPath();
                ctx.ellipse(x, y, 22, 15, 0, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function drawRoad() {
            const horizon = canvas.height * 0.38;
            const segments = 42;

            for (let i = segments; i >= 1; i--) {
                const t1 = i / segments;
                const t2 = (i - 1) / segments;
                const y1 = lerp(horizon, canvas.height, t1);
                const y2 = lerp(horizon, canvas.height, t2);
                const roadW1 = lerp(18, canvas.width * 0.82, t1);
                const roadW2 = lerp(18, canvas.width * 0.82, t2);

                const c1 = roadCurve(i * 55);
                const c2 = roadCurve((i - 1) * 55);

                const left1 = canvas.width / 2 + c1 - roadW1 * 0.5;
                const right1 = canvas.width / 2 + c1 + roadW1 * 0.5;
                const left2 = canvas.width / 2 + c2 - roadW2 * 0.5;
                const right2 = canvas.width / 2 + c2 + roadW2 * 0.5;

                ctx.beginPath();
                ctx.moveTo(left1, y1);
                ctx.lineTo(right1, y1);
                ctx.lineTo(right2, y2);
                ctx.lineTo(left2, y2);
                ctx.closePath();

                ctx.fillStyle = i % 2 === 0 ? '#6b7a7d' : '#5d6d70';
                ctx.fill();

                ctx.strokeStyle = '#ff6a59';
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                ctx.moveTo(left1, y1);
                ctx.lineTo(left2, y2);
                ctx.moveTo(right1, y1);
                ctx.lineTo(right2, y2);
                ctx.stroke();

                const laneW1 = roadW1 * 0.26;
                const laneW2 = roadW2 * 0.26;
                ctx.strokeStyle = '#f4f4f4';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(canvas.width / 2 + c1 - laneW1 * 0.5, y1);
                ctx.lineTo(canvas.width / 2 + c2 - laneW2 * 0.5, y2);
                ctx.moveTo(canvas.width / 2 + c1 + laneW1 * 0.5, y1);
                ctx.lineTo(canvas.width / 2 + c2 + laneW2 * 0.5, y2);
                ctx.stroke();
            }

            ctx.fillStyle = '#111';
            ctx.fillRect(0, canvas.height * 0.8, canvas.width, canvas.height * 0.2);
        }

        function drawFinishLine() {
            const x = canvas.width / 2 + roadCurve(0) * 0.2;
            const y = canvas.height * 0.73;
            ctx.save();
            ctx.translate(x, y);
            ctx.fillStyle = '#fff';
            ctx.fillRect(-12, -40, 24, 82);
            ctx.fillStyle = '#111';
            ctx.fillRect(-9, -38, 18, 78);
            for (let i = 0; i < 10; i++) {
                ctx.fillStyle = i % 2 === 0 ? '#fff' : '#000';
                ctx.fillRect(-7, -34 + i * 7, 14, 4);
            }
            ctx.restore();
        }

        function drawBotCar(bot) {
            const rel = bot.distance - game.distance;
            if (rel < 30 || rel > 1700) return;

            const depth = clamp(rel / 1700, 0.05, 1);
            const perspective = 1.15 - depth * 0.8;
            const roadHalf = lerp(25, canvas.width * 0.38, 1 - depth);
            const centerX = canvas.width / 2 + roadCurve(rel * 0.25);
            const x = centerX + bot.lane * roadHalf * 1.1;
            const y = lerp(canvas.height * 0.46, canvas.height * 0.94, 1 - depth);
            const w = 28 * perspective;
            const h = 48 * perspective;

            ctx.save();
            ctx.translate(x, y);
            ctx.fillStyle = bot.color;
            ctx.fillRect(-w / 2, -h / 2, w, h);
            ctx.fillStyle = '#111';
            ctx.fillRect(-w / 2 + 5, -h / 2 + 8, w - 10, h - 18);
            ctx.fillStyle = '#fff';
            ctx.font = '10px Segoe UI';
            ctx.fillText(bot.name, -w / 2, -h / 2 - 10);
            ctx.restore();
        }

        function drawPlayerCar() {
            const x = canvas.width / 2 + game.lane * 150;
            const y = canvas.height * 0.82;
            const tilt = game.lane * 16;

            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(tilt * Math.PI / 180);
            ctx.fillStyle = '#ff2d2d';
            ctx.fillRect(-22, -28, 44, 56);
            ctx.fillStyle = '#111';
            ctx.fillRect(-15, -18, 30, 22);
            ctx.fillStyle = '#f5f5f5';
            ctx.fillRect(-18, -24, 12, 10);
            ctx.fillRect(6, -24, 12, 10);
            ctx.restore();
        }

        function drawBlunder() {
            if (game.blunder <= 0) return;
            const alpha = game.blunder / 55;
            ctx.fillStyle = 'rgba(255, 70, 70, ' + (0.3 + alpha * 0.6) + ')';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = 'rgba(255,255,255,' + (0.7 + alpha) + ')';
            ctx.font = 'bold 42px Segoe UI';
            ctx.fillText('BLUNDER!', canvas.width / 2 - 140, canvas.height / 2);
        }

        function drawHUD() {
            hudGear.textContent = game.gear;
            hudSpeed.textContent = game.speed.toFixed(2);
            hudMax.textContent = getRacePosition();
        }

        function getRacePosition() {

                    new THREE.MeshBasicMaterial({ color: i % 2 ? 0x202326 : 0xf4f1e7 })
                );
                tile.position.set(-6 + (i % 7) * 2, 0.035, Math.floor(i / 7) * -1.2);
                startLine.add(tile);
            }
            scene.add(startLine);
            const startFrame = getTrackFrame(0);
            startLine.position.copy(startFrame.point);
            startLine.position.y = 0.065;
            startLine.rotation.y = Math.atan2(-startFrame.tangent.x, -startFrame.tangent.z);

            let lastTime = performance.now();
            function frame(now) {
                const dt = Math.min((now - lastTime) / 1000, 0.05);
                lastTime = now;

                if (!game.finished) {
                    const acceleration = 11 + game.gear * 2.6;
                    if (controls.forward) game.speed += acceleration * dt;
                    if (controls.reverse) game.speed -= 19 * dt;
                    if (controls.left) game.lane -= (2.6 + game.speed * 0.055) * dt;
                    if (controls.right) game.lane += (2.6 + game.speed * 0.055) * dt;

                    if (controls.nitro && game.boost <= 0) game.boost = 1.8;
                    if (game.boost > 0) {
                        game.boost -= dt;
                        game.speed += 15 * dt;
                    }

                    game.speed *= Math.pow(controls.forward ? 0.997 : 0.985, dt * 60);
                    game.speed = THREE.MathUtils.clamp(game.speed, -8, shiftLimit() + (game.boost > 0 ? 14 : 0));
                    game.lane = THREE.MathUtils.clamp(game.lane, -10, 10);

                    const offRoad = Math.abs(game.lane) > roadWidth * 0.43;
                    if (offRoad) game.speed *= Math.pow(0.91, dt * 60);
                    game.offRoad = offRoad;

                    game.distance += Math.max(0, game.speed) * dt;
                    if (game.distance >= trackLength) {
                        game.distance -= trackLength;
                        game.lap += 1;
                        if (game.lap > game.totalLaps) finishRace();
                    }

                    bots.forEach((bot, i) => {
                        bot.progress += (bot.speed + Math.sin(now * 0.00035 + i) * 1.8) * dt;
                        bot.lane = [-0.62, 0.2, -0.15, 0.66][i] + Math.sin(now * 0.0007 + i) * 0.08;
                    });
                }

                const world = raceScore();
                const playerFrame = getTrackFrame(game.distance);
                const playerPosition = playerFrame.point.clone().addScaledVector(playerFrame.side, game.lane);
                playerCar.position.copy(playerPosition);
                playerCar.rotation.y = Math.atan2(-playerFrame.tangent.x, -playerFrame.tangent.z)
                    - (controls.left ? 0.08 : 0) + (controls.right ? 0.08 : 0);

                bots.forEach((bot) => {
                    const botFrame = getTrackFrame(bot.progress);
                    bot.mesh.visible = true;
                    bot.mesh.position.copy(botFrame.point).addScaledVector(botFrame.side, bot.lane * 4.7);
                    bot.mesh.rotation.y = Math.atan2(-botFrame.tangent.x, -botFrame.tangent.z);
                });

                const desiredCamera = playerPosition.clone()
                    .addScaledVector(playerFrame.tangent, -15)
                    .add(new THREE.Vector3(0, 7.5, 0));
                camera.position.lerp(desiredCamera, Math.min(1, dt * 3.2));
                const lookAt = playerPosition.clone()
                    .addScaledVector(playerFrame.tangent, 32)
                    .add(new THREE.Vector3(0, 1.1, 0));
                camera.lookAt(lookAt);

                const speedKmh = Math.round(game.speed * 3.6);
                hudGear.textContent = game.gear;
                hudSpeed.textContent = speedKmh;
                hudPosition.textContent = getPosition();
                hudLap.textContent = Math.min(game.lap, game.totalLaps) + ' / ' + game.totalLaps;
                const standings = [
                    { name: 'YOU', progress: raceScore(), player: true },
                    ...bots.map((bot) => ({ name: bot.name, progress: bot.progress, player: false }))
                ].sort((a, b) => b.progress - a.progress);
                standingsElement.innerHTML = standings.map((entry, index) =>
                    '<div class="' + (entry.player ? 'standing-player' : '') + '">' +
                    (index + 1) + '. ' + entry.name + '</div>'
                ).join('');

                renderer.render(scene, camera);
                requestAnimationFrame(frame);
            }

            function resize() {
                const width = gameContainer.clientWidth;
                const height = gameContainer.clientHeight;
                if (!width || !height) return;
                renderer.setSize(width, height, false);
                camera.aspect = width / height;
                camera.updateProjectionMatrix();
            }

            window.addEventListener('resize', resize);
            if (window.ResizeObserver) new ResizeObserver(resize).observe(gameContainer);

            resetRace();
            updateScenery();
            frame(performance.now());
        })();
    </script>
</body>
</html>
